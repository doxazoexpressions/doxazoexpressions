workflows:
  ios-workflow:
    name: Doxazo iOS Workflow

    integrations:
      app_store_connect: DoxazoASC

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.doxazo.expressions
      vars:
        APP_STORE_APPLE_ID: "6785318591"
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: com.doxazo.expressions
        PRIVACY_URL: https://www.doxazoexpressions.com/privacy
        SUPPORT_URL:  https://www.doxazoexpressions.com/support

    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      # ── Required Reason API gate (Apple spec) ─────────────────────────
      - name: Verify PrivacyInfo.xcprivacy reason codes
        script: |
          set -e
          test -f ios/App/App/PrivacyInfo.xcprivacy
          python3 scripts/verify_privacy.py ios/App/App/PrivacyInfo.xcprivacy

      # ── Native push wiring (self-reporting, release-resolved) ─────────
      - name: Verify native push wiring
        script: |
          set +e
          FAILED=0
          ENT=ios/App/App/App.entitlements
          INF=ios/App/App/Info.plist

          echo '=== Native push wiring check for com.doxazo.expressions (Release) ==='

          DELEGATE=$(find ios -name 'AppDelegate*.swift' \
              -not -path '*/Pods/*' -not -path '*/build/*' \
              -not -path '*/.build/*' -print -quit 2>/dev/null)

          if [ -z "$DELEGATE" ]; then
            echo '(1) FAIL : AppDelegate.swift not found anywhere under ios/'
            find ios/App -name '*.swift' -not -path '*/Pods/*' \
                -not -path '*/build/*' -not -path '*/.build/*' 2>/dev/null
            grep -rln -E \
                'didRegisterForRemoteNotificationsWithDeviceToken|didFailToRegisterForRemoteNotificationsWithError' \
                ios 2>/dev/null | grep -v 'Pods' | grep -v '\.build' | grep -v 'build/'
            FAILED=$((FAILED+1))
            DEL=""
          else
            echo "(1) OK   : AppDelegate at $DELEGATE"
            DEL="$DELEGATE"
          fi

          if [ -n "$DEL" ]; then
            grep -qF 'didRegisterForRemoteNotificationsWithDeviceToken' "$DEL" \
              && echo '(2) OK   : didRegisterForRemoteNotificationsWithDeviceToken present' \
              || { echo "(2) FAIL : didRegisterForRemoteNotificationsWithDeviceToken missing in $DEL"; head -n 80 "$DEL"; FAILED=$((FAILED+1)); }
            grep -qF 'didFailToRegisterForRemoteNotificationsWithError' "$DEL" \
              && echo '(3) OK   : didFailToRegisterForRemoteNotificationsWithError present' \
              || { echo "(3) FAIL : didFailToRegisterForRemoteNotificationsWithError missing in $DEL"; FAILED=$((FAILED+1)); }
          else
            FAILED=$((FAILED+2))
          fi

          if [ -f "$INF" ]; then
            MODES=$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$INF" 2>/dev/null)
            echo "$MODES" | grep -qF 'remote-notification' \
              && echo '(4) OK   : UIBackgroundModes contains remote-notification' \
              || { echo "(4) FAIL : UIBackgroundModes lacks remote-notification"; echo "$MODES"; FAILED=$((FAILED+1)); }
          else
            echo "(4) FAIL : $INF missing"
            FAILED=$((FAILED+1))
          fi

          SETTINGS=$(xcodebuild -project ios/App/App.xcodeproj \
              -target App -configuration Release -showBuildSettings 2>/dev/null)
          RESOLVED=$(echo "$SETTINGS" | awk -F' = ' \
              '/^[[:space:]]*APS_ENVIRONMENT[[:space:]]*=/{print $2}' | head -n1)
          if [ "$RESOLVED" = "production" ]; then
            echo '(5) OK   : APS_ENVIRONMENT resolves to production for Release'
          else
            echo "(5) FAIL : APS_ENVIRONMENT resolved to '$RESOLVED' (expected 'production')"
            echo "$SETTINGS" | grep -iE '^[[:space:]]*(APS_|CODE_SIGN_ENTITLEMENTS|PRODUCT_BUNDLE_IDENTIFIER)'
            for f in $(find ios -name '*.xcconfig' -not -path '*/Pods/*' \
                -not -path '*/build/*' -not -path '*/.build/*' 2>/dev/null); do
              echo "==> $f"
              grep -nE 'APS_ENVIRONMENT|CODE_SIGN_ENTITLEMENTS' "$f" 2>/dev/null || true
            done
            FAILED=$((FAILED+1))
          fi

          if [ -f "$ENT" ]; then
            HAS_APS=$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$ENT" 2>/dev/null)
            [ -n "$HAS_APS" ] && echo "(6a) OK  : aps-environment key present (definition: $HAS_APS)" \
                                || { echo "(6a) FAIL: aps-environment key missing in $ENT"; FAILED=$((FAILED+1)); }
            HAS_SIA=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.applesignin:0' "$ENT" 2>/dev/null)
            [ "$HAS_SIA" = "Default" ] && echo "(6b) OK  : com.apple.developer.applesignin = Default" \
              || {
                   echo "(6b) FAIL: com.apple.developer.applesignin missing or != Default"
                   /usr/libexec/PlistBuddy -c 'Print' "$ENT" 2>&1 || true
                   FAILED=$((FAILED+1))
                 }
          else
            echo "(6) FAIL : $ENT not found"
            FAILED=$((FAILED+1))
          fi

          echo "=== Summary: $FAILED native-push check(s) failed ==="
          exit $FAILED


      # ── Sign in with Apple in App.entitlements (read-only assertion) ──
      - name: Verify Sign in with Apple in App.entitlements
        script: |
          set -e
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.applesignin:0" \
            ios/App/App/App.entitlements | grep -q 'Default'
          echo "Sign in with Apple entitlement declared (Default)"

      # ── CocoaPods only if Podfile exists (Capacitor SPM projects often don't)
      - name: Install CocoaPods (only if Podfile exists)
        script: |
          if [ -f ios/App/Podfile ]; then
            (cd ios/App && pod install)
          else
            echo "No Podfile — skipping pod install (Capacitor SPM)"
          fi

      # ── Drop stale profile shadows before re-fetching (Portal-side only) ─────
      - name: Delete stale App-Store profiles for com.doxazo.expressions
        script: |
          set +e
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          if [ -d "$DIR" ]; then
            BEFORE=$(ls "$DIR"/*.mobileprovision 2>/dev/null | wc -l | tr -d ' ')
            rm -f "$DIR"/*.mobileprovision
            echo "Removed $BEFORE stale profile(s) from $DIR; next fetch will pull the freshly reissued one."
          else
            echo "Profile dir not present yet (cold runner); nothing to purge."
          fi

      # ── FIXED: re-fetch profile, NOT create a new certificate ─────────
      # The previous version passed --create. With --create in effect,
      # app-store-connect fetch-signing-files attempts to issue a new
      # iOS Distribution certificate. Per the Codemagic CLI Tools docs:
      #   "--certificate-key=PRIVATE_KEY ... Used together with --save
      #    or --create options. ... If not given, the value will be
      #    checked from the environment variable CERTIFICATE_PRIVATE_KEY."
      # The workflow does NOT provide CERTIFICATE_PRIVATE_KEY, so the CLI
      # exited with "Cannot save Signing Certificates without certificate
      # private key". Removing --create ends the cert-creation attempt;
      # the integration `app_store_connect: DoxazoASC` (which already has
      # the App Store Connect API key + the existing cert's private usage)
      # will keep using the existing Apple Distribution certificate while
      # this step pulls the freshly reissued App Store profile carrying
      # the new com.apple.developer.applesignin entitlement.
      - name: Fetch signing files (force re-pull, NO cert creation)
        script: |
          set -e
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --delete-stale-profiles \
            --strict-match-identifier
          echo "Successfully fetched App Store profiles for $BUNDLE_ID"

      # ── Apply distribution cert to keychain (uses DoxazoASC integration) ─────
      - name: Initialize keychain
        script: |
          keychain initialize

      - name: Apply certificates to keychain
        script: |
          keychain add-certificates

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      # ── Profile-level checks
      - name: Verify provisioning profile includes APNs
        script: |
          python3 - <<'PY'
          import glob, os, plistlib, subprocess, sys
          bundle_id = "com.doxazo.expressions"
          profile_paths = glob.glob(os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles/*.mobileprovision"))
          matches = []
          for path in profile_paths:
              try:
                  xml = subprocess.check_output(["security", "cms", "-D", "-i", path], stderr=subprocess.DEVNULL)
                  profile = plistlib.loads(xml)
              except Exception:
                  continue
              entitlements = profile.get("Entitlements", {})
              app_identifier = entitlements.get("application-identifier", "")
              aps_environment = entitlements.get("aps-environment")
              if app_identifier.endswith("." + bundle_id) and aps_environment:
                  matches.append((profile.get("Name", path), aps_environment))
          if not matches:
              sys.exit("No provisioning profile for com.doxazo.expressions contains the aps-environment entitlement. Regenerate the App Store profile in Apple Developer Portal AFTER enabling Push Notifications.")
          for name, aps_environment in matches:
              print(f"Using push-capable profile: {name} ({aps_environment})")
          PY

      - name: Verify provisioning profile grants Sign in with Apple
        script: |
          python3 - <<'PY'
          import glob, os, plistlib, subprocess, sys
          bundle_id = "com.doxazo.expressions"
          for path in glob.glob(os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles/*.mobileprovision")):
              try:
                  xml = subprocess.check_output(["security", "cms", "-D", "-i", path], stderr=subprocess.DEVNULL)
                  prof = plistlib.loads(xml)
              except Exception:
                  continue
              ents = prof.get("Entitlements", {})
              if ents.get("application-identifier","").endswith("." + bundle_id):
                  signin = ents.get("com.apple.developer.applesignin")
                  if not signin:
                      sys.exit("Profile for com.doxazo.expressions lacks com.apple.developer.applesignin. Enable Sign in with Apple on the App ID in Apple Developer Portal, then Edit->Save the App Store profile so it is reissued.")
                  print("Profile grants com.apple.developer.applesignin:", signin)
                  break
          else:
              sys.exit("No profile for com.doxazo.expressions found.")
          PY

      # ── Increment build number for TestFlight
      - name: Increment build number
        script: |
          #!/bin/sh
          set -e
          cd "$CM_BUILD_DIR/ios/App"
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          NEW_BUILD=$((LATEST_BUILD + 1))
          echo "Using latest TestFlight build $LATEST_BUILD; setting build number to $NEW_BUILD"
          agvtool new-version -all "$NEW_BUILD"

      # ── Archive + .ipa
      - name: Build IPA
        script: |
          cd ios/App && xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"

      # ── Self-report xcodebuild error context for diagnosis
      - name: On Build failure, dump the xcodebuild error context
        script: |
          if [ -d /tmp/xcodebuild_logs ]; then
            ls -la /tmp/xcodebuild_logs/ 2>/dev/null || true
            echo "----- xcodebuild log tail (last 200 lines) -----"
            ls -1 /tmp/xcodebuild_logs/*.log 2>/dev/null | tail -n 1 | xargs tail -n 200 2>/dev/null || true
            echo "----- error: lines -----"
            grep -nE 'error:|BUILD FAILED|No profile|signing identity|certificate|entitlement' \
                 /tmp/xcodebuild_logs/*.log 2>/dev/null | head -n 40 || true
          else
            echo "No /tmp/xcodebuild_logs/ dir — re-run with verbose Codemagic logs enabled."
          fi
          exit 1

      # ── Post-build APNs in signed .ipa
      - name: Verify signed IPA includes APNs entitlement
        script: |
          set -e
          IPA="$(find ios/App/build/ios/ipa -maxdepth 1 -name '*.ipa' | head -n1)"
          test -n "$IPA"
          rm -rf /tmp/doxazo_ipa
          unzip -q "$IPA" -d /tmp/doxazo_ipa
          codesign -d --entitlements :- /tmp/doxazo_ipa/Payload/App.app > /tmp/doxazo_entitlements.plist 2>/tmp/doxazo_codesign.log
          /usr/libexec/PlistBuddy -c "Print :aps-environment" /tmp/doxazo_entitlements.plist | grep -q 'production'

      # ── Post-build privacy manifest re-check
      - name: Re-assert PrivacyInfo present and tracking disabled in signed IPA
        script: |
          set -e
          PI=/tmp/doxazo_ipa/Payload/App.app/PrivacyInfo.xcprivacy
          test -f "$PI"
          cp "$PI" /tmp/dxpi.xcprivacy
          python3 scripts/verify_privacy.py /tmp/dxpi.xcprivacy

      # ── Post-build microphone + Sign in with Apple re-check
      - name: Re-assert microphone usage description and Sign in with Apple in signed IPA
        script: |
          set -e
          python3 - <<'PY'
          import plistlib, sys
          info = plistlib.load(open('/tmp/doxazo_ipa/Payload/App.app/Info.plist','rb'))
          mic = info.get('NSMicrophoneUsageDescription','')
          assert mic.strip(),'NSMicrophoneUsageDescription missing in built .ipa'
          print('NSMicrophoneUsageDescription OK:', mic[:50])
          PY
          codesign -d --entitlements :- /tmp/doxazo_ipa/Payload/App.app \
            > /tmp/dx_entitlements.plist 2>/tmp/dx_codesign.log || true
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.applesignin:0" /tmp/dx_entitlements.plist | grep -q 'Default' \
            || { echo "Sign in with Apple entitlement missing in codesigned .app"; exit 1; }
          echo "Signed entitlements include aps-environment=production and com.apple.developer.applesignin=Default"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
